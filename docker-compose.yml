services:
  postgres:
    image: postgres:16
    container_name: digibank-postgres
    environment:
      POSTGRES_DB: digibankdb
      POSTGRES_USER: digibank
      POSTGRES_PASSWORD: digibank123
    ports:
      - "5432:5432"
    volumes:
      - digibank_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U digibank -d digibankdb"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  digibank_pgdata:
