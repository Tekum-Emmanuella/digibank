name: DigiBank CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    # Move concurrency inside the job
    concurrency:
      group: digibank-${{ github.head_ref || github.ref }}
      cancel-in-progress: true

    steps:
      # Step 1: Check out repository source
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17 (Temurin) with dependency caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Run full Maven lifecycle verification (Unit, Integration & BDD tests)
      - name: Execute Maven Verification
        run: mvn clean verify -B

      # Step 4: Archive the built application JAR
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with:
          name: digibank-web-executable-jar
          path: |
            digibank-web/target/*.jar
            !digibank-web/target/*-sources.jar
            !digibank-web/target/*-javadoc.jar
            !digibank-web/target/*.jar.original
          if-no-files-found: error
          retention-days: 7

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Validate Docker image build reproducibility
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: digibank-app:ci-latest