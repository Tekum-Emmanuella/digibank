name: DigiBank CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

    concurrency:
      group: ${{ github.workflow }}-${{ github.head_ref || github.ref}}
      cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out source code
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 Temurin with Maven dependency caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Step 3: Run full Maven build, unit tests, integration tests & BDD checks
      - name: Execute Maven Verification
        run: mvn clean verify -B

      - name: Run unit tests
        run: mvn test 

      # Step 4: Archive the built application JAR
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with:
          name: digibank-web-executable-jar
          path: | 
            digibank-web/target/*.jar
            !digibank-web/target/*-sources.jar
            !digibank-web/target/*-javadoc.jar
            !digibank-web/target/*.jar.original
          if-no-files-found: error
          retention-days: 7

      # Step 5: Set up Docker Buildx for container validation
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Validate Docker build reproducibility
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: digibank-app:ci-latest