name: DigiBank Quality Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build and test
        run: mvn -Ddependency-check.skip=true clean verify

      - name: Install artifacts to local repo (for Dependency-Check)
        run: mvn -Ddependency-check.skip=true clean install -DskipTests

      - name: Run OWASP Dependency-Check
        if: ${{ env.NVD_API_KEY != '' }}
        run: mvn -Ddependency-check.skip=false org.owasp:dependency-check-maven:check

      - name: Record Dependency-Check prerequisite note
        if: ${{ env.NVD_API_KEY == '' }}
        run: |
          mkdir -p target
          cat > target/dependency-check-report.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head><meta charset="utf-8"><title>Dependency-Check prerequisite</title></head>
          <body>
          <h1>OWASP Dependency-Check was not executed</h1>
          <p>The workflow requires the repository secret <code>NVD_API_KEY</code>. Configure it and rerun the workflow to generate the full vulnerability report.</p>
          </body>
          </html>
          HTML

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: "**/target/dependency-check-report.html"
          retention-days: 30

      - name: Run PITest (Mutation Testing)
        run: mvn org.pitest:pitest-maven:mutationCoverage

      - name: Upload PITest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pitest-reports
          path: "**/target/pit-reports"
          retention-days: 30

      - name: Run Surefire test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports"
          retention-days: 30

      - name: SonarQube Analysis
        if: github.event_name == 'push'
        run: >
          mvn sonar:sonar
          -Dsonar.projectKey=digibank-parent
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL || 'http://localhost:9000' }}
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
        continue-on-error: true
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Build Status
        if: always()
        run: |
          echo "## Build & Security Analysis Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build & Tests: Completed" >> $GITHUB_STEP_SUMMARY
          echo "✅ Dependency-Check: Completed or prerequisite note uploaded" >> $GITHUB_STEP_SUMMARY
          echo "✅ PITest (Mutation Testing): Completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Artifacts available for download:" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency-Check Report: dependency-check-report.html" >> $GITHUB_STEP_SUMMARY
          echo "- PITest Reports: pit-reports/" >> $GITHUB_STEP_SUMMARY
          echo "- Surefire Reports: surefire-reports/" >> $GITHUB_STEP_SUMMARY
