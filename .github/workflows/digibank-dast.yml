name: DigiBank DAST Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  dast-newman:
    name: Dynamic Security Testing (DAST / Newman)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: digibankdb
          POSTGRES_USER: digibank
          POSTGRES_PASSWORD: digibank123
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U digibank -d digibankdb"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build DigiBank Monolith
        run: mvn clean package -DskipTests -Ddependency-check.skip=true

      - name: Start DigiBank Application
        env:
          SPRING_PROFILES_ACTIVE: ci
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/digibankdb
          SPRING_DATASOURCE_USERNAME: digibank
          SPRING_DATASOURCE_PASSWORD: digibank123
        run: |
          nohup java -jar digibank-web/target/digibank-web-*.jar > digibank-app.log 2>&1 &

      - name: Wait for Application Readiness
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8080/api/customers > /dev/null 2>&1; then
              echo "DigiBank is up and responding!"
              exit 0
            fi
            echo "Waiting for DigiBank to start (attempt $i)..."
            sleep 3
          done
          echo "Application failed to start within timeout"
          cat digibank-app.log
          exit 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman & Reporters
        run: npm install -g newman newman-reporter-html

      - name: Run Newman DAST Suite
        run: |
          mkdir -p dast/reports
          newman run dast/postman/DigiBank-DAST-Collection.postman_collection.json \
            -e dast/postman/DigiBank-Local.postman_environment.json \
            --env-var baseUrl=http://localhost:8080 \
            --reporters cli,html,json \
            --reporter-html-export dast/reports/newman-report.html \
            --reporter-json-export dast/reports/newman-report.json

      - name: Upload Newman Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newman-dast-reports
          path: dast/reports/
          retention-days: 30

      - name: Upload Application Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: digibank-app-log
          path: digibank-app.log
          retention-days: 7
