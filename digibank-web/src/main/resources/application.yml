server:
  port: 8080
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

spring:
  application:
    name: digibank
  profiles:
    active: dev
  jpa:
    hibernate:
      # Safe-by-default: the schema is owned by Flyway migrations, so the app must never
      # auto-mutate it. Profiles must not weaken this back to "update"/"create".
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
  thymeleaf:
    cache: false
  sql:
    init:
      mode: never

springdoc:
  # Swagger/OpenAPI UI is disabled by default (increased attack/exposure surface if left on).
  # It is explicitly re-enabled only in the dev profile (application-dev.yml).
  api-docs:
    enabled: false
    path: /api-docs
  swagger-ui:
    enabled: false
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

logging:
  level:
    root: INFO
    org.springframework.web: INFO
    # Query/bind-parameter logging must stay at INFO by default to avoid leaking sensitive
    # data (account numbers, balances, national IDs...) into log files.
    org.hibernate.SQL: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
