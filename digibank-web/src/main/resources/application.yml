server:
  port: 8080

spring:
  application:
    name: digibank
  datasource:
    url: jdbc:postgresql://localhost:5432/digibankdb
    username: digibank
    password: digibank123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs
