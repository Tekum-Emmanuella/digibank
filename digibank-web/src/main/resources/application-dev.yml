spring:
  datasource:
    # Credentials are externalized via environment variables (Workshop 2 remediation):
    # never commit real usernames/passwords into a versioned application-*.yml file.
    # See .env.example for the variables to set locally (SPRING_DATASOURCE_URL/USERNAME/PASSWORD).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/digibankdb}
    username: ${SPRING_DATASOURCE_USERNAME:digibank}
    password: ${SPRING_DATASOURCE_PASSWORD:digibank123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Schema is owned by Flyway migrations; the app only validates it, never auto-mutates it.
      ddl-auto: validate
    # SQL logging stays disabled by default, even in dev, to avoid leaking query data/parameters.
    # Enable locally and temporarily (e.g. via -Dspring-boot.run.arguments) if you need to debug queries.
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

# Swagger/OpenAPI is convenient for local development; it stays off in the base
# application.yml and is only turned back on for the "dev" profile.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
